<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>覺醒技順序</title>
    <!-- 引入 Papa Parse 函式庫 -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h2>GitHub CSV 資料顯示</h2>
    <div id="table-container">載入中...</div>

    <script>
        // 請替換成你的 GitHub Raw 檔案真實網址
        const csvUrl = 'https://tim20214-web.github.io/sengokufubu/data.csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(csvText => {
                // 使用 PapaParse 解析 CSV 文字
                Papa.parse(csvText, {
                    header: true, // 若 CSV 第一列是標題請設為 true
                    complete: function(results) {
                        displayTable(results.data);
                    }
                });
            })
            .catch(error => {
                console.error('讀取失敗：', error);
                document.getElementById('table-container').innerText = '無法載入 CSV 檔案';
            });

        // 建立 HTML 表格函式
        function displayTable(data) {
            if (!data.length) return;
            
            let html = '<table border="1"><tr>';
            // 產生表頭
            const keys = Object.keys(data[0]);
            keys.forEach(key => { html += `<th>${key}</th>`; });
            html += '</tr>';

            // 產生資料列
            data.forEach(row => {
                html += '<tr>';
                keys.forEach(key => { html += `<td>${row[key] || ''}</td>`; });
                html += '</tr>';
            });
            html += '</table>';

            document.getElementById('table-container').innerHTML = html;
        }
    </script>
</body>
</html>
